<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="判斷已知條件能不能保證一個四邊形是平行四邊形，答完看判別依據或反例。">
  <title>這些條件夠不夠？ - 國中數學遊戲場</title>
  <link rel="icon" type="image/svg+xml" href="../header-logo.svg">
  <link rel="stylesheet" href="style.css">
  <script src="questions.js" defer></script>
  <script src="diagram.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="quiet" href="../index.html">← 回遊戲大廳</a>
      <div class="top-actions">
        <p id="score" class="score" hidden>答對 <b id="correct">0</b> ／ <b id="attempted">0</b></p>
        <button type="button" id="sound" class="quiet" aria-pressed="false">音效關</button>
      </div>
    </header>

    <main>
      <section id="menu" class="menu" aria-labelledby="title">
        <div class="intro">
          <h1 id="title" tabindex="-1">這些條件<span>夠不夠？</span></h1>
          <p class="unit">第4冊・第4章 平行與四邊形・第2節 平行四邊形</p>
          <p class="lead">只靠題目給的條件，能確定它是平行四邊形嗎？</p>

          <div class="mode-group" role="group" aria-label="選擇難度">
            <button type="button" data-mode="basic" aria-pressed="true"><strong>基礎</strong>讀文字條件</button>
            <button type="button" data-mode="challenge" aria-pressed="false"><strong>挑戰</strong>看記號配對</button>
          </div>
          <div class="menu-actions">
            <label for="limit">限時</label>
            <select id="limit">
              <option value="0">不限時</option>
              <option value="15">15 秒</option>
              <option value="25">25 秒</option>
              <option value="40">40 秒</option>
              <option value="60">60 秒</option>
            </select>
            <button type="button" id="start" class="primary">開始挑戰 <span aria-hidden="true">→</span></button>
          </div>
          <a class="learn-link" href="learn.html">平行四邊形小抄 ↗</a>
        </div>
        <figure class="board menu-board">
          <canvas id="demo" role="img" aria-label="平行四邊形的兩雙對邊分別平行，圖上用一個箭頭和兩個箭頭標記。"></canvas>
        </figure>
      </section>

      <section id="round" class="round" aria-labelledby="prompt" hidden>
        <div class="round-header">
          <span id="mode-label"></span>
          <div id="timer" class="timer" role="timer" aria-label="剩餘時間" hidden>
            <div class="track" aria-hidden="true"><div id="bar"></div></div>
            <span id="seconds"></span>
          </div>
        </div>

        <div id="round-layout" class="round-layout">
          <div class="question-card">
            <h2 id="prompt" tabindex="-1">一定是平行四邊形嗎？</h2>
            <p id="setup" class="setup"></p>
            <ul id="conditions" class="conditions"></ul>
            <div id="choices" class="choices" role="group" aria-label="作答">
              <button type="button" data-answer="yes" class="choice">一定是</button>
              <button type="button" data-answer="no" class="choice">不一定</button>
            </div>
            <div id="feedback" class="feedback" hidden>
              <p id="verdict" class="verdict" role="status" tabindex="-1"></p>
              <h3 id="reason-title"></h3>
              <p id="reason"></p>
            </div>
          </div>
          <figure id="figure" class="board figure" hidden>
            <canvas id="diagram" role="img"></canvas>
            <div class="diagram-actions" id="diagram-actions" role="group" aria-label="查看反例" hidden>
              <button type="button" class="quiet" data-diagram="given" aria-pressed="true">看已知條件</button>
              <button type="button" class="quiet" data-diagram="check" aria-pressed="false">檢查對角線</button>
            </div>
            <figcaption id="caption" aria-live="polite"></figcaption>
          </figure>
        </div>

        <div class="round-actions">
          <button type="button" id="leave" class="quiet">回選單</button>
          <button type="button" id="next" class="primary" hidden>下一題 <span aria-hidden="true">→</span></button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
