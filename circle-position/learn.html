  <title>圓的位置小抄 - 會碰到圓嗎？</title>
  <link rel="icon" type="image/svg+xml" href="../header-logo.svg">

<body class="circle-position">
  <header class="topbar"><a class="lobby-link" href="../index.html">← 回遊戲大廳</a></header>
  <main class="page">
    <article class="study">
      <h1>圓的位置小抄</h1>
      <p class="unit">第5冊・第2章 圓・第1節 點、直線與圓之間的位置關係</p>
      <h2>先找半徑，再找距離</h2>
      <ul>
        <li>半徑 <var>r</var> 等於直徑的一半。</li>
        <li>判斷點時，<var>d</var> 是圓心到該點的距離。</li>
        <li>判斷直線時，<var>d</var> 是圓心到直線的垂直距離。直線通過圓心時，距離是 0。</li>
      </ul>
      <table aria-label="比較距離與半徑">
        <thead><tr><th scope="col">比較</th><th scope="col">點</th><th scope="col">直線</th></tr></thead>
        <tbody>
          <tr><th scope="row"><var>d</var> &lt; <var>r</var></th><td>圓內</td><td>相交<span>2 個交點</span></td></tr>
          <tr><th scope="row"><var>d</var> ＝ <var>r</var></th><td>圓上</td><td>相切<span>1 個交點</span></td></tr>
          <tr><th scope="row"><var>d</var> &gt; <var>r</var></th><td>圓外</td><td>相離<span>0 個交點</span></td></tr>
        </tbody>
      </table>
      <h2>切點半徑垂直切線</h2>
      <p>直徑 12 公分，圓心到直線的距離是 6 公分。半徑也是 6 公分，所以恰好相切。從圓心連到切點的線段是半徑，和切線夾成直角。</p>
      <a class="text-link" href="index.html">← 回「會碰到圓嗎？」</a>
    </article>
  </main>
