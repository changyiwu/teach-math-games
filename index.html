<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中數學遊戲場</title>
  <link rel="icon" type="image/svg+xml" href="header-logo.svg">
  <meta name="description" content="國中數學課堂小遊戲合集，適合智慧白板與手機操作。">
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #141b34;
      --card: rgba(30, 41, 72, 0.9);
      --line: rgba(148, 163, 184, 0.25);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-2: #fbbf24;
      --cyan: #22d3ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0%, var(--bg-2), var(--bg) 70%) fixed;
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    header { text-align: center; margin-bottom: 32px; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.4rem);
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, var(--accent-2), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p { margin: 8px 0 0; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      display: block;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.18);
      outline: none;
    }

    .card .icon { font-size: 2.4rem; line-height: 1; }
    .card h2 { margin: 12px 0 4px; font-size: 1.4rem; color: var(--accent-2); }
    .card p { margin: 0; color: var(--muted); }
    .card .tag {
      display: inline-block;
      margin-top: 12px;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--cyan);
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a { color: var(--cyan); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>國中數學遊戲場</h1>
      <p>挑一個遊戲，開始挑戰吧！</p>
    </header>

    <main class="grid">
      <!-- 新遊戲：在專案根目錄新增子資料夾後，於此複製一張卡片 -->
      <a class="card" href="power-challenge/">
        <div class="icon" aria-hidden="true">⚡</div>
        <h2>次方大挑戰</h2>
        <p>隨機挑一題次方，限時內答出來就挑戰成功！</p>
        <span class="tag">次方・平方數</span>
      </a>

      <a class="card" href="exponent-rules/">
        <div class="icon" aria-hidden="true">⚖️</div>
        <h2>指數律對錯快判</h2>
        <p>螢幕出一個式子，限時內判斷它對還是錯，答錯立刻看正解。</p>
        <span class="tag">指數律・2-4</span>
      </a>
    </main>

    <footer>
      <a href="https://changyiwu.github.io/teach-math-web/" target="_blank" rel="noopener noreferrer">國中數學教學整合網</a>
    </footer>
  </div>
</body>
</html>
