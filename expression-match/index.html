<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列式選選看 - 國中數學遊戲場</title>
  <link rel="icon" type="image/svg+xml" href="../header-logo.svg">
  <meta name="description" content="螢幕出一句生活敘述，限時內從四個式子裡挑出正確的代數式或方程式。">
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #141b34;
      --panel: rgba(20, 27, 52, 0.82);
      --card: rgba(30, 41, 72, 0.9);
      --line: rgba(148, 163, 184, 0.25);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-2: #fbbf24;
      --win: #22c55e;
      --lose: #ef4444;
      --cyan: #22d3ee;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      background: radial-gradient(ellipse at 50% 20%, var(--bg-2), var(--bg) 70%) fixed;
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* ── 版面骨架 ───────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
    }
    body[data-view="menu"] #menu,
    body[data-view="play"] #play,
    body[data-view="result"] #play { display: flex; }

    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 16, 32, 0.55);
      backdrop-filter: blur(6px);
    }

    .home {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .home:hover, .home:focus-visible { color: var(--text); }

    .spacer { flex: 1 1 auto; }

    .stat {
      font-size: 0.95rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .stat b { color: var(--accent-2); font-size: 1.15rem; }
    .streak { color: var(--accent); }
    .streak[hidden] { display: none; }

    .icon-btn {
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      border-radius: 10px;
      width: 40px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--cyan); }

    /* ── 待機畫面 ───────────────────────────── */
    .menu-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 20px 16px 32px;
      text-align: center;
      overflow-y: auto;
    }

    h1.title {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.2rem);
      letter-spacing: 0.06em;
      background: linear-gradient(90deg, var(--accent-2), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 2.2vw, 1.25rem);
      max-width: 36ch;
      line-height: 1.7;
    }

    .ctl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .ctl {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      font-size: 1rem;
    }
    .ctl .label { color: var(--muted); font-size: 0.92rem; }
    .ctl button {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .ctl button:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
    .ctl button:disabled { opacity: 0.35; cursor: default; }
    .ctl b { min-width: 2.1em; text-align: center; color: var(--accent-2); }

    .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 16px;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
    }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button[aria-pressed="true"] { background: rgba(245, 158, 11, 0.18); color: var(--accent-2); }

    .big-btn {
      margin-top: 4px;
      padding: 18px 44px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      color: #231a05;
      font-size: clamp(1.2rem, 3.4vw, 1.9rem);
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
    }
    .big-btn:hover { filter: brightness(1.06); }
    .big-btn:active { transform: translateY(2px); }

    .learn-link {
      color: var(--cyan);
      text-decoration: none;
      font-size: 1rem;
      border-bottom: 1px dashed rgba(34, 211, 238, 0.5);
      padding-bottom: 2px;
    }
    .learn-link:hover { color: var(--accent-2); border-color: var(--accent-2); }

    .keys {
      color: var(--muted);
      font-size: 0.85rem;
      opacity: 0.8;
    }
    .keys kbd {
      display: inline-block;
      padding: 1px 7px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.6);
      font-family: inherit;
      font-size: 0.85em;
    }

    /* ── 作答畫面 ───────────────────────────── */
    .timer {
      flex: 0 0 auto;
      height: 10px;
      background: rgba(15, 23, 42, 0.8);
    }
    .timer > i {
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, var(--cyan), var(--accent-2));
      transition: background 0.3s;
    }
    body.urgent .timer > i { background: linear-gradient(90deg, var(--accent), var(--lose)); }

    .play-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.4vh, 26px);
      padding: 14px 16px 18px;
      min-height: 0;
    }

    .rule-tag {
      padding: 4px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--cyan);
      font-size: clamp(0.85rem, 1.8vw, 1.05rem);
      background: var(--panel);
      text-align: center;
    }
    .rule-tag .src { color: var(--accent-2); }

    .quest {
      font-size: clamp(1.1rem, 3.1vw, 2.15rem);
      font-weight: 600;
      line-height: 1.6;
      text-align: center;
      max-width: 30ch;
      padding: 0 6px;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    }
    .quest b { color: var(--accent-2); font-weight: 800; }

    .count {
      position: absolute;
      top: 54px;
      right: 18px;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 800;
      color: var(--accent-2);
      opacity: 0.85;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    body.urgent .count { color: var(--lose); }
    body[data-view="result"] .count { display: none; }

    .opts {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 1.8vw, 20px);
      width: min(1000px, 100%);
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: clamp(12px, 2.6vh, 24px) clamp(12px, 2vw, 20px);
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
    }
    .opt .key {
      flex: 0 0 auto;
      width: 1.9em;
      height: 1.9em;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--cyan);
      font-size: clamp(0.95rem, 2.1vw, 1.3rem);
      font-weight: 800;
    }
    .opt .txt {
      flex: 1 1 auto;
      font-size: clamp(1.05rem, 2.7vw, 1.9rem);
      font-weight: 700;
      line-height: 1.45;
      word-break: break-word;
    }
    .opt:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--accent); }
    .opt:disabled { cursor: default; }
    .opt.is-right { border-color: var(--win); background: rgba(34, 197, 94, 0.16); }
    .opt.is-right .key { color: var(--win); border-color: var(--win); }
    .opt.is-wrong { border-color: var(--lose); background: rgba(239, 68, 68, 0.14); }
    .opt.is-wrong .key { color: var(--lose); border-color: var(--lose); }
    .opt.is-dim { opacity: 0.35; }

    /* ── 結果 ───────────────────────────────── */
    .verdict {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px 16px;
      background: radial-gradient(ellipse at center, rgba(2, 6, 23, 0.76), rgba(2, 6, 23, 0.94));
      backdrop-filter: blur(3px);
      overflow-y: auto;
    }
    body[data-view="result"] .verdict { display: flex; }

    .verdict h2 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4.6rem);
      letter-spacing: 0.06em;
      animation: pop 0.35s cubic-bezier(0.2, 1.5, 0.4, 1);
    }
    .verdict.ok h2 { color: var(--win); text-shadow: 0 0 30px rgba(34, 197, 94, 0.5); }
    .verdict.ng h2 { color: var(--lose); text-shadow: 0 0 30px rgba(239, 68, 68, 0.45); }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .solution {
      width: min(820px, 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: clamp(14px, 3vw, 24px);
      text-align: center;
    }
    .solution .tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 2px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--cyan);
      font-size: 0.9rem;
    }
    .solution .ask {
      color: var(--muted);
      font-size: clamp(0.95rem, 2.2vw, 1.2rem);
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .solution .right {
      font-size: clamp(1.3rem, 4.4vw, 2.4rem);
      font-weight: 800;
      line-height: 1.4;
      color: var(--win);
      margin-bottom: 8px;
    }
    .solution .picked {
      font-size: clamp(0.95rem, 2.3vw, 1.25rem);
      color: var(--lose);
      margin-bottom: 10px;
    }
    .solution .picked[hidden] { display: none; }
    .solution .why {
      color: var(--text);
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      line-height: 1.8;
      opacity: 0.95;
    }
    .solution .why em {
      font-style: normal;
      color: var(--accent-2);
      font-weight: 700;
    }

    .verdict-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

    .ghost-btn {
      padding: 12px 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .ghost-btn:hover { border-color: var(--cyan); color: var(--cyan); }

    /* ── 堆疊分數 ───────────────────────────── */
    .fr {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      line-height: 1.1;
      font-size: 0.74em;
      margin: 0 0.06em;
    }
    .fr i { font-style: normal; padding: 0 0.24em; }
    .fr i:first-child { border-bottom: 0.09em solid currentColor; }

    @media (max-width: 620px) {
      .opts { grid-template-columns: 1fr; gap: 9px; }
      .opt { padding: 11px 12px; }
      .quest { max-width: none; }
    }

    @media (max-width: 480px) {
      .topbar { padding: 8px 12px; gap: 8px; }
      .stat { font-size: 0.85rem; }
      .count { top: 64px; right: 12px; font-size: 2rem; }
    }

    @media (max-height: 560px) {
      .quest { font-size: clamp(1rem, 2.6vw, 1.5rem); }
      .opt { padding: 9px 12px; }
    }
  </style>
</head>
<body data-view="menu">

  <!-- ── 待機 ───────────────────────────── -->
  <section class="screen" id="menu">
    <header class="topbar">
      <a class="home" href="../index.html">← 回遊戲大廳</a>
      <div class="spacer"></div>
      <div class="stat">答對 <b id="m-correct">0</b> ／ 挑戰 <b id="m-total">0</b></div>
      <button type="button" class="icon-btn" id="mute" aria-label="音效開關" title="音效開關">🔊</button>
    </header>

    <div class="menu-body">
      <h1 class="title">列式選選看</h1>
      <p class="hint">螢幕出一句生活敘述，<span class="limit-val">15</span> 秒內從四個式子裡挑出<strong>正確的那一個</strong>。答錯會立刻告訴你錯在哪。</p>

      <div class="ctl-row">
        <div class="ctl">
          <span class="label">⏱ 限時</span>
          <button type="button" data-step="-5" aria-label="減少 5 秒">−</button>
          <b class="limit-val">15</b>秒
          <button type="button" data-step="5" aria-label="增加 5 秒">＋</button>
        </div>
        <div class="seg" id="level" role="group" aria-label="題組難度">
          <button type="button" data-level="basic" aria-pressed="false">列代數式</button>
          <button type="button" data-level="adv" aria-pressed="false">列方程式</button>
          <button type="button" data-level="all" aria-pressed="true">混合</button>
        </div>
      </div>

      <button type="button" class="big-btn" id="start">🎲 開始挑戰</button>
      <a class="learn-link" href="learn.html">📖 先看列式小抄</a>
      <p class="keys">鍵盤：<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 或 <kbd>A</kbd>～<kbd>D</kbd> 作答　<kbd>空白</kbd> 下一題</p>
    </div>
  </section>

  <!-- ── 作答 ───────────────────────────── -->
  <section class="screen" id="play">
    <div class="timer"><i id="bar"></i></div>
    <header class="topbar">
      <a class="home" href="../index.html">← 回遊戲大廳</a>
      <div class="spacer"></div>
      <div class="stat streak" id="streak" hidden>🔥 連對 <b id="streak-n">0</b></div>
      <div class="stat">答對 <b id="p-correct">0</b> ／ 挑戰 <b id="p-total">0</b></div>
      <button type="button" class="icon-btn" id="mute2" aria-label="音效開關" title="音效開關">🔊</button>
    </header>

    <div class="count" id="count">15</div>

    <div class="play-body">
      <div class="rule-tag" id="rule">以文字符號列式</div>
      <div class="quest" id="quest"></div>
      <div class="opts" id="opts">
        <button type="button" class="opt" data-i="0"><span class="key">A</span><span class="txt"></span></button>
        <button type="button" class="opt" data-i="1"><span class="key">B</span><span class="txt"></span></button>
        <button type="button" class="opt" data-i="2"><span class="key">C</span><span class="txt"></span></button>
        <button type="button" class="opt" data-i="3"><span class="key">D</span><span class="txt"></span></button>
      </div>
    </div>
  </section>

  <!-- ── 判定 ───────────────────────────── -->
  <div class="verdict" id="verdict">
    <h2 id="verdict-text">答對了！</h2>
    <div class="solution">
      <div class="tag" id="sol-tag">以文字符號列式</div>
      <div class="ask" id="sol-ask"></div>
      <div class="right" id="sol-right"></div>
      <div class="picked" id="sol-picked" hidden></div>
      <div class="why" id="sol-why"></div>
    </div>
    <div class="verdict-btns">
      <button type="button" class="big-btn" id="next">▸ 下一題</button>
      <button type="button" class="ghost-btn" id="back">結束這輪</button>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);

  /* ── 設定（記在這台瀏覽器）────────────── */
  const LIMIT_MIN = 5, LIMIT_MAX = 60, LIMIT_DEF = 15;
  let limit = clampLimit(parseInt(localStorage.getItem('em-limit'), 10) || LIMIT_DEF);
  let level = ['basic', 'adv', 'all'].includes(localStorage.getItem('em-level'))
    ? localStorage.getItem('em-level') : 'all';
  let muted = localStorage.getItem('em-muted') === '1';

  function clampLimit(v) {
    const n = Math.round(v / 5) * 5;
    return Math.min(LIMIT_MAX, Math.max(LIMIT_MIN, n));
  }

  /* ── 小工具 ─────────────────────────── */
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const F = (n, d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
  const LBL = ['A', 'B', 'C', 'D'];

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = R(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ── 題庫 ───────────────────────────────
     level  basic＝3-1 以文字符號列式／求值／化簡
            adv  ＝3-2 列方程式、3-3 應用問題
     opts[0] 永遠是正解，顯示時才洗牌。
     題幹與誘答選項取自康軒 115 版 1 上第 3 章課本
     （隨堂練習、自我檢核、挑錯題）與歷屆基測會考。
  ───────────────────────────────────── */
  const QUESTIONS = [
    /* ── 3-1 以文字符號列式 ───────────── */
    { level: 'basic', tag: '以文字符號列式',
      q: '比 x 大 5 的數，可以寫成什麼？',
      opts: ['x + 5', '5x', 'x − 5', '5 − x'],
      why: '「比 x 大 5」是在 x 上面<em>加 5</em>，寫成 x＋5；5x 是「x 的 5 倍」，意思完全不同。' },

    { level: 'basic', tag: '以文字符號列式',
      q: '比 y 小 3 的數，可以寫成什麼？',
      opts: ['y − 3', '3 − y', 'y + 3', 'y ÷ 3'],
      why: '「比 y 小 3」是從 y <em>減掉 3</em>，寫成 y－3；3－y 問的是「3 比 y 多多少」。' },

    { level: 'basic', tag: '以文字符號列式',
      q: () => `x 的 ${F(2, 3)} 倍，可以寫成什麼？`,
      opts: () => [`${F(2, 3)}x`, `x + ${F(2, 3)}`, `${F(3, 2)}x`, `x − ${F(2, 3)}`],
      why: () => `「○ 的 ${F(2, 3)} 倍」就是<em>乘上</em> ${F(2, 3)}，寫成 ${F(2, 3)}x；倍數千萬不要寫成加減。` },

    { level: 'basic', tag: '以文字符號列式',
      q: '把 a 平分成 3 等分，每一份是多少？',
      opts: () => [F('a', 3), '3a', 'a − 3', F(3, 'a')],
      why: () => `平分成 3 等分就是<em>除以 3</em>，a÷3 記成 ${F('a', 3)}；3a 是 a 的 3 倍，剛好相反。` },

    { level: 'basic', tag: '以文字符號列式',
      q: '比 c 的 2 倍多 10 的數，可以寫成什麼？',
      opts: ['2c + 10', '2(c + 10)', '10c + 2', '2c − 10'],
      why: '先算「c 的 2 倍」得 2c，再「多 10」就是＋10。2(c＋10) 是<em>先加 10 再乘 2</em>，順序不一樣。' },

    { level: 'basic', tag: '以文字符號列式',
      q: () => `比 x 的 ${F(2, 3)} 倍小 4 的數，可以寫成什麼？`,
      opts: () => [`${F(2, 3)}x − 4`, `${F(2, 3)}(x − 4)`, `4 − ${F(2, 3)}x`, `${F(3, 2)}x − 4`],
      why: () => `先算 ${F(2, 3)} 倍得 ${F(2, 3)}x，再「小 4」就是<em>減 4</em>，不要把 4 包進括號裡一起乘。` },

    { level: 'basic', tag: '以文字符號列式',
      q: '一杯奶茶 b 元，奶茶比紅茶<b>貴</b> 15 元。一杯紅茶多少元？',
      opts: ['b − 15', 'b + 15', '15 − b', '15b'],

      q: '服飾店外套原價 250 元、襯衫和褲子原價都是 125 元。某日外套打六折、襯衫和褲子打八折，共賣出 200 件、共得 24000 元。設外套賣出 x 件，可列出哪一個方程式？',
      opts: ['0.6×250x + 0.8×125(200 − x) = 24000', '0.6×250x + 0.8×125(200 + x) = 24000', '0.8×125x + 0.6×250(200 − x) = 24000', '0.8×125x + 0.6×250(200 + x) = 24000'],
      why: '外套 x 件打<em>六折</em>，其餘 <em>(200－x)</em> 件打八折。總共 200 件，所以另一種件數是 200 減去 x。' },

    { level: 'adv', tag: '費用問題', src: '90 年第二次基本學測',
      q: '山泉水平日每公升 70 元、假日特價；水桶每個 60 元、容量 3 公升。阿惠假日用販賣的水桶裝 6 公升山泉水回家，共花 330 元。特價每公升多少元？',
      opts: ['35 元', '45 元', '55 元', '65 元'],
      why: '6 公升要<em>2 個水桶</em>，桶子花 60×2＝120 元；水花 330－120＝210 元，210÷6＝35 元／公升。忘了算水桶就會選錯。' }
  ];

  const val = v => (typeof v === 'function' ? v() : v);

  function pool() {
    return level === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.level === level);
  }

  /* 洗牌後逐題發，發完才重洗，同一輪不會重複出題 */
  let deck = [], deckKey = '';
  function nextQuestion() {
    if (deckKey !== level || deck.length === 0) {
      deckKey = level;
      deck = shuffle(pool());
    }
    const src = deck.pop();
    const opts = val(src.opts);
    const order = shuffle([0, 1, 2, 3]);
    return {
      tag: src.tag,
      src: src.src || '',
      q: val(src.q),
      why: val(src.why),
      opts: order.map(i => opts[i]),
      ans: order.indexOf(0)
    };
  }

  /* ── 音效 ───────────────────────────── */
  let ac = null;
  function audio() {
    if (muted) return null;
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ac = new C();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, when = 0, type = 'sine', vol = 0.16) {
    const c = audio();
    if (!c) return;
    const t0 = c.currentTime + when;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  const sfxOk = () => { tone(660, 0.12, 0); tone(880, 0.12, 0.09); tone(1320, 0.26, 0.18); };
  const sfxNg = () => { tone(300, 0.18, 0, 'square', 0.1); tone(190, 0.32, 0.14, 'square', 0.1); };
  const sfxTick = () => tone(1000, 0.05, 0, 'triangle', 0.07);
  const sfxUp = () => tone(520, 0.08, 0, 'triangle', 0.1);

  /* ── 狀態 ───────────────────────────── */
  let correct = 0, total = 0, streak = 0;
  let cur = null, deadline = 0, raf = 0, lastTick = -1, locked = true;

  const optBtns = Array.from(document.querySelectorAll('.opt'));

  function setView(v) { document.body.dataset.view = v; }

  function paintScore() {
    $('m-correct').textContent = $('p-correct').textContent = correct;
    $('m-total').textContent = $('p-total').textContent = total;
    $('streak-n').textContent = streak;
    $('streak').hidden = streak < 2;
  }

  function paintLimit() {
    document.querySelectorAll('.limit-val').forEach(el => { el.textContent = limit; });
    document.querySelectorAll('.ctl button[data-step]').forEach(b => {
      const step = Number(b.dataset.step);
      b.disabled = step < 0 ? limit <= LIMIT_MIN : limit >= LIMIT_MAX;
    });
  }

  function paintLevel() {
    document.querySelectorAll('#level button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.level === level));
    });
  }

  function paintMute() {
    const label = muted ? '🔇' : '🔊';
    $('mute').textContent = label;
    $('mute2').textContent = label;
  }

  /* ── 出題 ───────────────────────────── */
  function startQuestion() {
    cur = nextQuestion();
    $('rule').innerHTML = cur.src
      ? `${cur.tag}　<span class="src">【${cur.src}】</span>`
      : cur.tag;
    $('quest').innerHTML = cur.q;
    optBtns.forEach((b, i) => {
      b.querySelector('.txt').innerHTML = cur.opts[i];
      b.querySelector('.key').textContent = LBL[i];
      b.disabled = false;
      b.classList.remove('is-right', 'is-wrong', 'is-dim');
    });
    locked = false;
    document.body.classList.remove('urgent');
    setView('play');
    deadline = performance.now() + limit * 1000;
    lastTick = -1;
    tickLoop();
  }

  function tickLoop() {
    cancelAnimationFrame(raf);
    const step = () => {
      const left = Math.max(0, deadline - performance.now());
      const ratio = left / (limit * 1000);
      $('bar').style.transform = `scaleX(${ratio})`;
      const sec = Math.ceil(left / 1000);
      if (sec !== lastTick) {
        lastTick = sec;
        $('count').textContent = sec;
        if (sec <= 3 && sec > 0) { document.body.classList.add('urgent'); sfxTick(); }
      }
      if (left <= 0) { judge(null); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  /* ── 判定 ───────────────────────────── */
  function judge(picked) {
    if (locked) return;
    locked = true;
    cancelAnimationFrame(raf);
    document.body.classList.remove('urgent');

    const timeout = picked === null;
    const win = !timeout && picked === cur.ans;

    optBtns.forEach((b, i) => {
      b.disabled = true;
      if (i === cur.ans) b.classList.add('is-right');
      else if (i === picked) b.classList.add('is-wrong');
      else b.classList.add('is-dim');
    });

    total += 1;
    if (win) { correct += 1; streak += 1; } else { streak = 0; }
    paintScore();

    const v = $('verdict');
    v.classList.toggle('ok', win);
    v.classList.toggle('ng', !win);
    $('verdict-text').textContent = timeout ? '時間到！' : (win ? '答對了！' : '答錯了');

    $('sol-tag').innerHTML = cur.src ? `${cur.tag}　【${cur.src}】` : cur.tag;
    $('sol-ask').innerHTML = cur.q;
    $('sol-right').innerHTML = `✓ ${LBL[cur.ans]}　${cur.opts[cur.ans]}`;
    const pk = $('sol-picked');
    if (!win && !timeout) {
      pk.innerHTML = `✗ 你選的是 ${LBL[picked]}　${cur.opts[picked]}`;
      pk.hidden = false;
    } else {
      pk.hidden = true;
    }
    $('sol-why').innerHTML = cur.why;

    if (win) { sfxOk(); if (streak >= 3) sfxUp(); } else { sfxNg(); }
    setView('result');
    $('next').focus({ preventScroll: true });
  }

  /* ── 事件 ───────────────────────────── */
  $('start').addEventListener('click', () => { audio(); startQuestion(); });
  $('next').addEventListener('click', startQuestion);
  $('back').addEventListener('click', () => {
    cancelAnimationFrame(raf);
    locked = true;
    setView('menu');
  });

  optBtns.forEach(b => {
    b.addEventListener('click', () => judge(Number(b.dataset.i)));
  });

  document.querySelectorAll('.ctl button[data-step]').forEach(b => {
    b.addEventListener('click', () => {
      limit = clampLimit(limit + Number(b.dataset.step));
      localStorage.setItem('em-limit', String(limit));
      paintLimit();
    });
  });

  document.querySelectorAll('#level button').forEach(b => {
    b.addEventListener('click', () => {
      level = b.dataset.level;
      localStorage.setItem('em-level', level);
      deck = [];
      paintLevel();
    });
  });

  [$('mute'), $('mute2')].forEach(b => b.addEventListener('click', () => {
    muted = !muted;
    localStorage.setItem('em-muted', muted ? '1' : '0');
    paintMute();
  }));

  document.addEventListener('keydown', e => {
    const view = document.body.dataset.view;
    if (view === 'play') {
      const n = '1234'.indexOf(e.key);
      const i = n >= 0 ? n : LBL.indexOf(e.key.toUpperCase());
      if (i >= 0) { e.preventDefault(); judge(i); }
    } else if (view === 'result') {
      if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); startQuestion(); }
      else if (e.key === 'Escape') { e.preventDefault(); setView('menu'); }
    } else if (view === 'menu') {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); audio(); startQuestion(); }
    }
  });

  // 分頁切到背景時暫停倒數，避免回來就時間到
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && document.body.dataset.view === 'play' && !locked) {
      cancelAnimationFrame(raf);
      const left = Math.max(800, deadline - performance.now());
      const resume = () => {
        if (document.hidden) return;
        document.removeEventListener('visibilitychange', resume);
        deadline = performance.now() + left;
        tickLoop();
      };
      document.addEventListener('visibilitychange', resume);
    }
  });

  /* ── 初始 ───────────────────────────── */
  paintScore();
  paintLimit();
  paintLevel();
  paintMute();
})();
</script>
</body>
</html>
